# Деплой вставляет эти строки в начало .htaccess сайта (блок «acme security»). Правьте здесь, а не на сервере.
# Каждое правило — в <IfModule>: на виртуальном хостинге модуля может не быть, сайт при этом ломаться не должен.
# Проверка после выкладки: bash wordpress/deploy/hardening-check.sh https://домен

# --- Заголовки безопасности ---
<IfModule mod_headers.c>
	# Браузер не угадывает тип файла по содержимому: загруженная «картинка» со скриптом внутри не выполнится.
	Header always set X-Content-Type-Options "nosniff"
	# Чужим сайтам уходит только домен, без пути и параметров; внутри сайта адрес передаётся целиком (аналитика).
	Header always set Referrer-Policy "strict-origin-when-cross-origin"
	# Сайт не пользуется камерой, микрофоном, геопозицией, оплатой и USB — запрещаем их и встроенным чужим скриптам.
	# Понадобилась функция (например, карта «где я») — уберите её из списка.
	Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
	# Сайт нельзя встроить в чужую страницу (защита от кликджекинга). X-Frame-Options — для старых браузеров,
	# frame-ancestors — для современных (при наличии второго первый они игнорируют).
	# Полной Content-Security-Policy нет намеренно: после согласия на cookie сайт подключает Google Tag Manager,
	# а тот загружает скрипты с заранее не известных адресов — строгая политика их сломает.
	# Нужен Вебвизор Яндекс Метрики (он показывает сайт во фрейме) — замените значение на:
	#   "frame-ancestors 'self' https://metrika.yandex.ru https://metrika.yandex.by https://metrica.yandex.com https://webvisor.com https://*.webvisor.com"
	Header always set X-Frame-Options "SAMEORIGIN"
	Header always set Content-Security-Policy "frame-ancestors 'self'"
	# Версию PHP посетителю знать незачем.
	Header always unset X-Powered-By
	Header unset X-Powered-By
</IfModule>

# --- Файлы, которые не должны открываться по адресу ---
# Через mod_rewrite, а не Require/Deny: он уже нужен WordPress для ЧПУ, значит разрешён на любом хостинге, где
# сайт вообще работает (директива, запрещённая настройками хостинга, уронила бы весь сайт с ошибкой 500).
<IfModule mod_rewrite.c>
	RewriteEngine On
	# Скрытые файлы и папки: .env, .git, .user.ini. Папка /.well-known/ (выпуск сертификатов) остаётся доступной.
	RewriteRule (^|/)\.(?!well-known/) - [F]
	# wp-config.php — пароли базы; readme.html и license.txt выдают версию WordPress; xmlrpc.php — подбор паролей
	# и DDoS через pingback (сам XML-RPC отключён в плагине, inc/security.php).
	RewriteRule ^(wp-config(-sample)?\.php|xmlrpc\.php|readme\.html|license\.txt)$ - [F,NC]
	# Дампы базы, журналы (wp-content/debug.log), резервные копии файлов.
	RewriteRule \.(sql|sql\.gz|log|bak|orig|swp)$ - [F,NC]
</IfModule>
