# Деплой кладёт эти строки в wp-content/uploads/.htaccess (блок «acme uploads»). Правьте здесь, а не на сервере.
# В папке загрузок лежат только картинки и документы. Если через уязвимость плагина туда попадёт PHP-файл,
# сервер его не выполнит и не отдаст. Через mod_rewrite — по той же причине, что в htaccess-security.conf.
# Свой RewriteEngine в папке отменяет правила корневого .htaccess, поэтому запрет скрытых файлов и дампов повторён.
<IfModule mod_rewrite.c>
	RewriteEngine On
	RewriteRule \.(php\d?|phtml|phar|pht|shtml|cgi|pl|py)$ - [F,NC]
	RewriteRule (^|/)\. - [F]
	RewriteRule \.(sql|sql\.gz|log|bak|orig|swp)$ - [F,NC]
</IfModule>
