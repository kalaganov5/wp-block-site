# Деплой вставляет эти строки в .htaccess (блок «acme hsts») только на боевом сайте с адресом https://.
# На тестовом и локальном блок пуст: домен без сертификата после такого заголовка перестал бы открываться.
# HSTS: браузер год ходит на сайт только по HTTPS, даже если набрать http://. Заголовок отдаётся только в ответ
# на HTTPS-запрос (напрямую или через прокси хостинга с X-Forwarded-Proto).
# Без includeSubDomains и preload — намеренно: они распространяют правило на все поддомены (в том числе тестовый
# dev.<домен>), а из списка preload домен убирается месяцами. Добавляйте, только если весь домен на HTTPS навсегда.
<IfModule mod_headers.c>
	<IfModule mod_setenvif.c>
		SetEnvIf X-Forwarded-Proto "^https$" ACME_TLS=1
	</IfModule>
	Header always set Strict-Transport-Security "max-age=31536000" env=HTTPS
	Header always set Strict-Transport-Security "max-age=31536000" env=ACME_TLS
</IfModule>
