# Локальная копия сайта в Docker. Запуск: docker compose up -d  →  http://localhost:8080 (админка: admin / admin).
# Тема и плагин подключены из папки репозитория: правки видны сразу после обновления страницы.
#   С телефона: ACME_BIND=0.0.0.0 docker compose up -d, затем node wordpress/local/phone.js (адрес и QR-код).
#   phpMyAdmin: docker compose --profile tools up -d  →  http://localhost:8081 (база wp).
# Подробно — wordpress/README.md, раздел «Локальный сайт (Docker)».
name: acme

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    build:
      context: wordpress/local
      args:
        # Версия PHP локального сайта; минимальная поддерживаемая — 8.3 (см. wordpress/local/Dockerfile).
        PHP_VERSION: ${ACME_PHP:-8.4}
    image: acme-local
    depends_on:
      db:
        condition: service_healthy
    ports:
      # По умолчанию сайт виден только с этого компьютера; ACME_BIND=0.0.0.0 — и из локальной сети (телефон).
      - '${ACME_BIND:-127.0.0.1}:${ACME_PORT:-8080}:80'
    volumes:
      - html:/var/www/html
      - ./wordpress/acme:/var/www/html/wp-content/themes/acme
      - ./wordpress/acme-core:/var/www/html/wp-content/plugins/acme-core
      # Сайт открывается по любому адресу (localhost или IP в сети) без правки базы. Только локально.
      - ./wordpress/local/acme-local-host.php:/var/www/html/wp-content/mu-plugins/acme-local-host.php:ro

  # База в браузере. Запускается только с профилем: docker compose --profile tools up -d
  phpmyadmin:
    image: phpmyadmin:5.2
    profiles: ['tools']
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_USER: wp
      PMA_PASSWORD: wp
      UPLOAD_LIMIT: 256M
    ports:
      - '127.0.0.1:${ACME_PMA_PORT:-8081}:80'

  # Одноразовый: ставит WordPress, плагины и контент (первый запуск) или обновляет их, затем завершается.
  setup:
    image: acme-local
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    entrypoint: ['bash', '/acme/local/setup.sh']
    restart: 'no'
    environment:
      SITE_URL: http://localhost:${ACME_PORT:-8080}
      # Кеш страниц локально выключен: правки темы видны сразу. Проверить кеш: ACME_PAGE_CACHE=1 docker compose up -d
      PAGE_CACHE: ${ACME_PAGE_CACHE:-0}
    volumes:
      - html:/var/www/html
      - ./wordpress/acme:/var/www/html/wp-content/themes/acme
      - ./wordpress/acme-core:/var/www/html/wp-content/plugins/acme-core
      - ./wordpress:/acme:ro
      - ./local-data:/acme-data:ro

volumes:
  db:
  html:
